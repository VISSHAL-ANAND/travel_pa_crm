<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel-PA — Holiday Enquiry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-l:#e0c46a;--gold-d:#9a7a28;--gold-gradient:linear-gradient(135deg,#c9a84c,#e8d08a,#c9a84c);--navy:#0e1c2e;--cream:#faf7f2;--white:#fff;--txt:#0e1c2e;--muted:#666878;--border:#ddd6c8;--sel:#fdf8ed;--shadow:0 8px 32px rgba(14,28,46,.12)}
body{font-family:'Cormorant Garamond',serif;background:var(--cream);color:var(--txt);height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
.sidebar{position:relative;overflow:hidden;background:var(--navy)}
.sb-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.sb-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(14,28,46,.38));z-index:1}
.main{background:#fff;display:flex;flex-direction:column;height:100vh;min-width:0}
.prog{padding:18px 52px 14px;border-bottom:1px solid #ede8df;background:#fff}
.steps{display:flex}.step{flex:1;text-align:center;position:relative}
.step:not(:last-child):after{content:'';position:absolute;top:14px;left:50%;width:100%;height:1px;background:#ede8df}.step.done:not(:last-child):after,.step.active:not(:last-child):after{background:var(--gold)}
.step-dot{position:relative;z-index:1;margin:auto;width:28px;height:28px;border:1.5px solid var(--border);border-radius:50%;display:grid;place-items:center;background:#fff;font:600 10px Jost;color:#999}
.step.done .step-dot,.step.active .step-dot{background:var(--gold-gradient);border-color:var(--gold);color:#fff}
.step.active .step-dot{box-shadow:0 0 0 4px rgba(201,168,76,.18)}
.step-label{margin-top:6px;font:600 8.5px Jost;color:#999;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
.step.done .step-label,.step.active .step-label{color:var(--gold-d)}
.content{flex:1;overflow-y:auto;padding:38px 56px 24px}
.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.pg-title{font:700 38px/1.15 'Playfair Display';color:var(--navy);margin-bottom:10px}
.pg-sub{font:italic 16px/1.5 'Cormorant Garamond';color:#4a4a5a}
.gold-bar{width:48px;height:2px;background:var(--gold-gradient);margin:18px 0 28px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;border:1px solid var(--border);border-radius:14px;min-height:98px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff;cursor:pointer;text-align:center;box-shadow:0 2px 10px rgba(14,28,46,.05);transition:.2s}
.card:hover{border-color:var(--gold-l);box-shadow:var(--shadow);transform:translateY(-2px)}.card.sel{border-color:var(--gold);background:var(--sel);box-shadow:0 0 0 1.5px var(--gold),0 6px 20px rgba(14,28,46,.08)}
.card svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.5;color:#87909c}.card.sel svg{color:var(--gold)}
.c-lbl{font:600 13px Jost;color:var(--txt)}.card.sel .c-lbl{color:var(--gold-d)}
.chk{position:absolute;right:9px;top:9px;width:19px;height:19px;border-radius:50%;display:none;place-items:center;background:var(--gold-gradient);color:#fff}.chk svg{width:11px;height:11px;stroke:#fff}.card.sel .chk{display:grid}
.sec-lbl{font:700 10px Jost;letter-spacing:2px;text-transform:uppercase;color:#999;margin:24px 0 13px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .card{min-width:130px;min-height:54px;flex-direction:row;padding:13px 18px}
.fg{margin-bottom:16px}.fg label{display:block;font:700 10px Jost;letter-spacing:1.5px;text-transform:uppercase;color:#8a8a8a;margin-bottom:8px}.required{color:#b24b3d}
input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:13px 15px;background:#fff;color:var(--txt);font:400 15px Jost;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.1)}textarea{min-height:110px;resize:vertical}
.form-max{max-width:780px}.conditional-panel{border:1px solid #e8dfcf;background:#fdfbf7;border-radius:15px;padding:18px;margin-top:24px}.conditional-panel .sec-lbl{margin-top:0}.conditional-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.region-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.region-card{border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;background:#fff}.region-card.sel{border-color:var(--gold);background:var(--sel)}.region-name{font:600 15px Jost}.region-count{font:400 11px Jost;color:#999;margin-top:3px}
.dest-pills{display:flex;gap:9px;flex-wrap:wrap}.dest-pill{border:1px solid var(--border);padding:10px 16px;border-radius:999px;background:#fff;font:500 13px Jost;cursor:pointer}.dest-pill.sel{border-color:var(--gold);background:var(--sel);color:var(--gold-d)}
.timing-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:850px}.date-box{border:1px solid var(--border);border-radius:10px;padding:14px;font:600 13px Jost;margin-bottom:12px}.cal-wrap{border:1px solid var(--border);border-radius:12px;padding:15px;max-width:420px}.cal-hd{display:flex;justify-content:space-between;align-items:center;font:600 13px Jost;margin-bottom:10px}.cal-nav{border:0;background:none;font-size:24px;cursor:pointer}.cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-d{padding:9px 0;text-align:center;border-radius:7px;font:500 12px Jost;cursor:pointer}.cal-dl{font:700 9px Jost;color:#999;text-align:center;padding:4px 0}.cal-d:hover{background:var(--sel)}.cal-d.past{color:#ccc!important}.cal-d.today{font-weight:800}.cal-d.picked,.cal-d.range-start,.cal-d.range-end{background:var(--gold);color:#fff}.cal-d.range-middle{background:#f5ecd5;color:var(--gold-d)}
.footer{display:flex;align-items:center;justify-content:space-between;padding:13px 52px 18px;border-top:1px solid #ede8df;background:#fff}.btn{border:0;border-radius:9px;padding:12px 21px;font:600 13px Jost;cursor:pointer}.btn-back{background:#f2f2f2;color:#344054}.btn-next{background:var(--gold-gradient);color:#fff;box-shadow:0 5px 18px rgba(201,168,76,.25)}.btn:disabled{opacity:.55}.secure{font:600 10px Jost;color:#aaa;letter-spacing:1px;text-transform:uppercase}.complete{text-align:center;padding:70px 20px;max-width:700px;margin:auto}.done-icon{width:76px;height:76px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto 24px}.done-icon svg{stroke:#fff;width:34px;height:34px}.done-title{font:600 42px 'Playfair Display';color:var(--navy)}.done-sub{font:italic 17px/1.6 'Cormorant Garamond';color:#5d5d68}
@media(max-width:1050px){.app{grid-template-columns:260px 1fr}.content{padding:30px 30px}.prog{padding:14px 25px}.footer{padding:12px 25px}.g4{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){body{overflow:auto}.app{display:block;height:auto;min-height:100vh}.sidebar{height:190px}.sb-img{object-position:center}.main{height:auto;min-height:calc(100vh - 190px)}.prog{overflow:auto}.steps{min-width:650px}.content{padding:24px 18px}.g4,.g3,.g2,.region-grid,.conditional-grid,.timing-grid{grid-template-columns:1fr 1fr}.pg-title{font-size:29px}.footer{padding:12px 18px}.secure{display:none}}
@media(max-width:480px){.g4,.g3,.g2,.region-grid,.conditional-grid{grid-template-columns:1fr}.content{padding:20px 14px}.pg-title{font-size:26px}.step-label{font-size:7px}.footer{position:sticky;bottom:0}.row .card{flex:1;min-width:110px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="sb-overlay"></div><img id="sideImg" class="sb-img" alt="Travel destination"></aside>
<main class="main">
<div class="prog"><div id="steps" class="steps"></div></div>
<div id="pageContent" class="content"></div>
<div id="footer" class="footer"><button id="backBtn" class="btn btn-back" onclick="prev()">← Back</button><div class="secure">Private &amp; Secure</div><button id="nextBtn" class="btn btn-next" onclick="next()">Next →</button></div>
</main>
</div>
<script>
const STEPS=["Holiday","Destination","Travellers","Dates","Preferences","Occasion","Budget","Departure","Contact","Complete"];
const IMAGES=[
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1526772662000-3f88f10405ff?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
];
const params=new URLSearchParams(location.search);
const agentRef=params.get("agent");
const slugRef=params.get("slug");
let agentId=agentRef;
let agent=null;
let core={};
let customQuestions=[];
let cur=0;
const ans={
 holidayTypes:[],dynamic:{},destination:"",ideas:"",
 adults:2,children:0,infants:0,childrenAges:"",rooms:"1",roomType:"",accessibility:"",accessibilityDetails:"",
 dates:"",datesEnd:"",nights:"",preferences:[],occasions:[],mustHave:"",avoid:"",anythingElse:"",
 budgetType:"",budget:"",flights:"",loc:"",firstName:"",lastName:"",email:"",phone:"",
 contactMethod:"Email",bestTime:"Anytime",referral:"",referralName:"",customAnswers:{}
};
const destinationRegions=[
["Indian Ocean",["Maldives","Mauritius","Seychelles","Sri Lanka","India"]],
["Middle East",["Dubai","Abu Dhabi","Oman","Fujairah","Ras al Khaimah","Qatar","Saudi Arabia","AlUla"]],
["Europe",["Greece","Spain","Cyprus","Portugal","Turkey","Croatia","Italy","Lapland","Switzerland","Malta","Montenegro","Iceland","France","Finland"]],
["Caribbean & Mexico",["Barbados","Saint Lucia","Antigua And Barbuda","Aruba","Grenada","Jamaica","St Barths","Dominican Republic","Anguilla","Bahamas","Mexico"]],
["Far East",["Thailand","Indonesia","Vietnam","Malaysia","Cambodia","Singapore","Japan","Philippines","Hong Kong"]],
["North America",["USA","Canada"]],["Africa",["South Africa","Kenya","Tanzania and Zanzibar","Morocco","Botswana","Zimbabwe","Rwanda"]],
["Australasia",["Australia","New Zealand"]],["Cruise",["Mediterranean","Caribbean","Northern Europe","Asia & Far East","South America","Alaska","Antarctica"]]
];
const icon=(path)=>'<svg viewBox="0 0 24 24"><path d="'+path+'"/></svg>';
const icons={plane:"M3 11l18-7-7 18-3-8-8-3z",hotel:"M3 20V8h18v12M7 12h3M14 12h3M7 16h3M14 16h3",ship:"M3 17h18M5 14l2-7h10l2 7M12 7V3M8 14h8",heart:"M20.8 8.8c0 5-8.8 10.5-8.8 10.5S3.2 13.8 3.2 8.8A4.8 4.8 0 0112 6.2a4.8 4.8 0 018.8 2.6z",family:"M8 7a3 3 0 100-6 3 3 0 000 6M16 8a2.5 2.5 0 100-5 2.5 2.5 0 000 5M2 21v-4a6 6 0 0112 0v4M13 21v-3a5 5 0 0110 0v3",sport:"M12 3a9 9 0 100 18 9 9 0 000-18",spa:"M12 22C7 18 5 13 8 9c2-3 6-3 8 0 3 4 1 9-4 13z",search:"M21 21l-4.3-4.3M10.8 18a7.2 7.2 0 100-14.4 7.2 7.2 0 000 14.4z"};
function chk(){return '<span class="chk"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 6"/></svg></span>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(value,label,key,icoKey="search"){const selected=Array.isArray(ans[key])&&ans[key].includes(value);return '<div class="card '+(selected?'sel':'')+'" onclick="toggleArray(\''+key+'\',\''+esc(value).replace(/'/g,"\\'")+'\',this)">'+chk()+icon(icons[icoKey]||icons.search)+'<div class="c-lbl">'+esc(label)+'</div></div>'}
function toggleArray(key,value,el){if(!Array.isArray(ans[key]))ans[key]=[];const i=ans[key].indexOf(value);if(i>=0)ans[key].splice(i,1);else ans[key].push(value);if(el)el.classList.toggle("sel",i<0);if(key==="holidayTypes")renderConditional();updateNext();clearError()}
function setValue(key,value){ans[key]=value;updateNext();clearError()}
async function loadConfig(){
 const endpoint=agentRef?"/api/public/form-config/"+encodeURIComponent(agentRef):slugRef?"/api/public/form-config/slug/"+encodeURIComponent(slugRef):null;
 if(!endpoint)return false;
 const r=await fetch(endpoint);const p=await r.json();
 if(!r.ok||!p.success)throw new Error(p.message||"Unable to load questionnaire");
 agentId=p.agent?.id||agentId;agent=p.agent||null;core=p.coreQuestionnaire||{};customQuestions=p.questions||[];
 if(agent?.brandName)document.title=agent.brandName+" — Holiday Enquiry";
 return true;
}
function renderSteps(){document.getElementById("steps").innerHTML=STEPS.map((s,i)=>'<div class="step '+(i<cur?"done":i===cur?"active":"")+'"><div class="step-dot">'+(i<cur?"✓":i+1)+'</div><div class="step-label">'+s+'</div></div>').join("")}
function setSide(){const im=document.getElementById("sideImg");if(im)im.src=IMAGES[cur]||IMAGES[0]}
function field(label,html){return '<div class="fg"><label>'+label+'</label>'+html+'</div>}
function choiceRow(key,values){return '<div class="row">'+values.map(v=>'<div class="card '+(ans[key]===v?"sel":"")+'" onclick="setSingle(\''+key+'\',\''+esc(v).replace(/'/g,"\\'")+'\',this)">'+chk()+'<div class="c-lbl">'+esc(v)+'</div></div>').join("")+'</div>'}
function setSingle(key,value,el){ans[key]=value;if(el)el.parentElement.querySelectorAll(".card").forEach(c=>c.classList.remove("sel"));if(el)el.classList.add("sel");updateNext();clearError()}
function conditionalActive(branchName){const values=ans.holidayTypes||[];return values.includes(branchName)}
function renderConditional(){
 const host=document.getElementById("conditional");if(!host)return;
 const branches=core.conditionalBranches||{};
 const active=Object.entries(branches).filter(([name])=>conditionalActive(name));
 host.innerHTML=active.map(([name,b])=>'<div class="conditional-panel"><div class="sec-lbl">'+esc(b.title||name)+'</div><div class="conditional-grid">'+(b.questions||[]).map(q=>renderCore(q)).join("")+'</div></div>').join("");
}
function renderCore(q){
 const v=ans.dynamic[q.id];const label=esc(q.label||q.id);
 if(q.type==="multiselect")return field(label+'<span class="required">*</span>','<div class="grid g3">'+(q.options||[]).map(o=>'<div class="card '+(Array.isArray(v)&&v.includes(o)?"sel":"")+'" onclick="toggleDynamic(\''+q.id+'\',\''+esc(o).replace(/'/g,"\\'")+'\',this)">'+chk()+'<div class="c-lbl">'+esc(o)+'</div></div>').join("")+'</div>');
 if(q.type==="select")return field(label+'<span class="required">*</span>','<select onchange="setDynamic(\''+q.id+'\',this.value)"><option value="">Select...</option>'+(q.options||[]).map(o=>'<option '+(v===o?"selected":"")+'>'+esc(o)+'</option>').join("")+'</select>');
 return field(label+'<span class="required">*</span>','<input type="'+(q.type==="date"?"date":q.type==="number"?"number":"text")+'" value="'+esc(v||"")+'" oninput="setDynamic(\''+q.id+'\',this.value)">');
}
function setDynamic(id,v){ans.dynamic[id]=v;updateNext();clearError()}
function toggleDynamic(id,v,el){if(!Array.isArray(ans.dynamic[id]))ans.dynamic[id]=[];const i=ans.dynamic[id].indexOf(v);if(i>=0)ans.dynamic[id].splice(i,1);else ans.dynamic[id].push(v);if(el)el.classList.toggle("sel",i<0);updateNext();clearError()}
function s0(pc){
 const types=core.holidayTypes||["Package Holiday","Tailor Made Holiday","Cruise","Villa","Tour","City Break","Family Holiday","Honeymoon","Group Travel","Business Travel","Sports/Event Travel","Ski Holiday","Safari","Luxury Holiday","Beach Holiday","Not Sure Yet"];
 const iconsFor={Cruise:"ship","Honeymoon:"heart","Family Holiday:"family","Sports/Event Travel:"sport","Luxury Holiday:"hotel","Beach Holiday:"spa"};
 pc.innerHTML='<div class="pg-title">Let\'s start planning your holiday.</div><div class="pg-sub">Choose all the holiday types that describe what you\'re looking for.</div><div class="gold-bar"></div><div class="grid g4">'+types.map(t=>card(t,t,"holidayTypes",iconsFor[t]||"search")).join("")+'</div><div id="conditional"></div>';renderConditional()
}
function s1(pc){
 const all=destinationRegions.flatMap(x=>x[1]);
 pc.innerHTML='<div class="pg-title">Where would you like to go?</div><div class="pg-sub">Search for a destination, or tell us if you are open to ideas.</div><div class="gold-bar"></div>'+
 field("Destination",'<input list="destinations" value="'+esc(ans.destination)+'" placeholder="Search destination..." oninput="setValue(\'destination\',this.value);ans.dest=this.value?[this.value]:[]"><datalist id="destinations">'+all.map(x=>'<option>'+esc(x)+'</option>').join("")+'</datalist>')+
 '<div class="sec-lbl">Open to ideas?</div>'+choiceRow("ideas",["Yes","Maybe","No"])+
 '<div class="sec-lbl">Explore by region</div><div class="region-grid">'+destinationRegions.map(x=>'<div class="region-card '+(ans.destRegions[0]===x[0]?"sel":"")+'" onclick="selectRegion(\''+esc(x[0]).replace(/'/g,"\\'")+'\')"><div class="region-name">'+esc(x[0])+'</div><div class="region-count">'+x[1].length+' destinations</div></div>').join("")+'</div>'+
 '<div id="regionDest"></div>';renderRegionDest()
}
function selectRegion(name){ans.destRegions=[name];renderRegionDest();updateNext();clearError()}
function renderRegionDest(){const host=document.getElementById("regionDest");if(!host)return;const r=destinationRegions.find(x=>x[0]===ans.destRegions[0]);if(!r){host.innerHTML="";return}host.innerHTML='<div class="sec-lbl">Destinations in '+esc(r[0])+'</div><div class="dest-pills">'+r[1].map(d=>'<div class="dest-pill '+(ans.destination===d?"sel":"")+'" onclick="setDestination(\''+esc(d).replace(/'/g,"\\'")+'\')">'+esc(d)+'</div>').join("")+'</div>'}
function setDestination(d){ans.destination=d;ans.dest=[d];renderRegionDest();updateNext();clearError()}
function s2(pc){
 pc.innerHTML='<div class="pg-title">Tell us about your travellers.</div><div class="pg-sub">This helps us match the right rooms and arrangements.</div><div class="gold-bar"></div>'+
 '<div class="grid g3 form-max">'+field("Adults *",'<input type="number" min="1" value="'+ans.adults+'" oninput="setValue(\'adults\',Number(this.value)||0)">')+field("Children",'<input type="number" min="0" value="'+ans.children+'" oninput="setValue(\'children\',Number(this.value)||0)">')+field("Infants",'<input type="number" min="0" value="'+ans.infants+'" oninput="setValue(\'infants\',Number(this.value)||0)">')+'</div>'+
 '<div class="grid g2 form-max">'+field("Children ages",'<input value="'+esc(ans.childrenAges)+'" placeholder="e.g. 6, 10" oninput="setValue(\'childrenAges\',this.value)">')+field("Rooms",'<select onchange="setValue(\'rooms\',this.value)">'+["1","2","3"].map(v=>'<option '+(ans.rooms===v?"selected":"")+'>'+v+'</option>').join("")+'</select>')+field("Room type",'<input value="'+esc(ans.roomType)+'" placeholder="Double, Twin, Family..." oninput="setValue(\'roomType\',this.value)">')+field("Accessibility",'<select onchange="setValue(\'accessibility\',this.value);renderAccessibility()"><option value="">Select...</option><option '+(ans.accessibility==="Yes"?"selected":"")+'>Yes</option><option '+(ans.accessibility==="No"?"selected":"")+'>No</option></select>')+'</div><div id="accessibilityField" class="form-max"></div>';renderAccessibility()}
function renderAccessibility(){const h=document.getElementById("accessibilityField");if(h)h.innerHTML=ans.accessibility==="Yes"?field("If yes, please tell us more",'<textarea oninput="setValue(\'accessibilityDetails\',this.value)">'+esc(ans.accessibilityDetails)+'</textarea>'):""}
function s3(pc){
 pc.innerHTML='<div class="pg-title">When would you like to travel?</div><div class="pg-sub">Choose your departure and return dates, or give us the number of nights.</div><div class="gold-bar"></div><div class="grid g2 form-max">'+field("Departure date *",'<input type="date" value="'+ans.dates+'" min="'+new Date().toISOString().slice(0,10)+'" onchange="setValue(\'dates\',this.value);renderDateBox()">')+field("Return date *",'<input type="date" value="'+ans.datesEnd+'" min="'+new Date().toISOString().slice(0,10)+'" onchange="setValue(\'datesEnd\',this.value);renderDateBox()">')+'</div>'+
 field("Number of nights *",'<select onchange="setValue(\'nights\',this.value)"><option value="">Select...</option>'+((core.nights||["5","7","10","11","14","21","Flexible","Other"]).map(v=>'<option '+(ans.nights===v?"selected":"")+'>'+v+'</option>').join(""))+'</select>')+
 '<div class="sec-lbl">Date flexibility</div>'+choiceRow("flex",["Specific dates","Flexible"])}
function s4(pc){const vals=core.holidayPreferences||[];pc.innerHTML='<div class="pg-title">What matters most?</div><div class="pg-sub">Select the things that matter most for your holiday.</div><div class="gold-bar"></div><div class="grid g4">'+vals.map(v=>card(v,v,"preferences","search")).join("")+'</div>'}

function customField(q){const v=ans.customAnswers[q.id];if(q.type==="textarea")return field(esc(q.label),'<textarea oninput="setCustom(\''+q.id+'\',this.value)">'+esc(v||"")+'</textarea>');if(q.type==="select")return field(esc(q.label),'<select onchange="setCustom(\''+q.id+'\',this.value)"><option value="">Select...</option>'+((q.options||[]).map(o=>'<option '+(v===o?"selected":"")+'>'+esc(o)+'</option>').join(""))+'</select>');if(q.type==="multiselect")return field(esc(q.label),'<div class="grid g3">'+(q.options||[]).map(o=>'<div class="card '+(Array.isArray(v)&&v.includes(o)?"sel":"")+'" onclick="toggleCustom(\''+q.id+'\',\''+esc(o).replace(/'/g,"\\'")+'\',this)">'+chk()+'<div class="c-lbl">'+esc(o)+'</div></div>').join("")+'</div>');if(q.type==="checkbox")return '<div class="card '+(v?"sel":"")+'" onclick="setCustom(\''+q.id+'\',!ans.customAnswers[\''+q.id+'\'],this)" style="flex-direction:row;min-height:55px;margin-bottom:16px">'+chk()+'<div class="c-lbl">'+esc(q.label)+'</div></div>';return field(esc(q.label),'<input type="'+(q.type==="date"?"date":q.type==="number"?"number":"text")+'" value="'+esc(v||"")+'" oninput="setCustom(\''+q.id+'\',this.value)">')}

 const review='<div class="conditional-panel"><div class="sec-lbl">Review</div><div class="pg-sub">Check the key details before submitting.</div><div style="font:14px/1.8 Jost;color:#4a4a5a;margin-top:12px"><strong>Holiday:</strong> '+esc(ans.holidayTypes.join(", "))+'<br><strong>Destination:</strong> '+esc(ans.destination||"Open to ideas")+'<br><strong>Travellers:</strong> '+ans.adults+' adults, '+ans.children+' children, '+ans.infants+' infants<br><strong>Dates:</strong> '+esc(ans.dates)+' — '+esc(ans.datesEnd)+' ('+esc(ans.nights)+' nights)<br><strong>Budget:</strong> '+esc(ans.budget)+' · '+esc(ans.budgetType)+' · Flights: '+esc(ans.flights)+'</div></div>';

 '<div class="sec-lbl">Preferred contact</div>'+choiceRow("contactMethod",core.contactMethods||["Phone","WhatsApp","Email"])+

 (ans.referral==="Referral"?field("Referral name",'<input value="'+esc(ans.referralName)+'" oninput="setValue(\'referralName\',this.value)">'):"")+
 '<div class="sec-lbl">Additional questions</div>'+customQuestions.map(customField).join("")}
function renderDateBox(){}
function requiredOk(v){return Array.isArray(v)?v.length>0:String(v??"").trim()!==""}
function validate(){
 if(cur===0)return ans.holidayTypes.length>0;
 if(cur===1)return requiredOk(ans.destination)||ans.ideas==="Yes"||ans.ideas==="Maybe";
 if(cur===2)return Number(ans.adults)>=1&&requiredOk(ans.rooms)&&requiredOk(ans.accessibility);
 if(cur===3)return requiredOk(ans.dates)&&requiredOk(ans.datesEnd)&&requiredOk(ans.nights);
 if(cur===4)return ans.preferences.length>0;
 if(cur===5)return ans.occasions.length>0&&(requiredOk(ans.mustHave)||requiredOk(ans.avoid)||requiredOk(ans.anythingElse));
 if(cur===6)return requiredOk(ans.budgetType)&&requiredOk(ans.budget)&&requiredOk(ans.flights);
 if(cur===7)return requiredOk(ans.loc);
 if(cur===8){if(!requiredOk(ans.firstName)||!requiredOk(ans.lastName)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ans.email)||!requiredOk(ans.phone))return false;return customQuestions.every(q=>!q.required||requiredOk(ans.customAnswers[q.id]));}
 return true
}
function errMsg(){return ["Please select at least one holiday type.","Please choose a destination or tell us you are open to ideas.","Please complete the traveller details.","Please select departure, return and number of nights.","Please select at least one preference.","Please select an occasion and add at least one detail.","Please choose your budget basis, amount and flight preference.","Please select or enter your departure location.","Please complete your contact details and any required custom questions.",""][cur]||""}
function clearError(){const e=document.getElementById("err");if(e)e.remove()}
function showError(){clearError();const e=document.createElement("div");e.id="err";e.style.cssText="color:#a33b31;font:600 12px Jost;margin:12px 0";e.textContent=errMsg();document.getElementById("pageContent").appendChild(e)}
function updateNext(){const b=document.getElementById("nextBtn");if(b)b.style.opacity=validate()?"1":".55"}
function render(){renderSteps();setSide();const pc=document.getElementById("pageContent");[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9][cur](pc);document.getElementById("backBtn").style.visibility=cur===0?"hidden":"visible";document.getElementById("nextBtn").style.display=cur===9?"none":"block";updateNext()}
async function next(){
  if(!validate()){showError();return}
  clearError()
  if(cur===8){await submit();return}
  if(cur<9){cur++;render()}
}
function prev(){if(cur>0){cur--;render()}}
async function submit(){
 try {
 const payload={firstName:ans.firstName,lastName:ans.lastName,email:ans.email,phone:ans.phone,holidayTypes:ans.holidayTypes,tripDreams:ans.holidayTypes,destination:ans.destination,destinationVibes:ans.destination?[ans.destination]:[],ideas:ans.ideas,travelDateStart:ans.dates,travelDateEnd:ans.datesEnd,nights:ans.nights,adults:ans.adults,children:ans.children,infants:ans.infants,childrenAges:ans.childrenAges,rooms:ans.rooms,roomTypes:ans.roomType,accessibility:ans.accessibility,accessibilityDetails:ans.accessibilityDetails,budgetType:ans.budgetType,budget:ans.budget,nightlyBudget:ans.budget,flights:ans.flights,preferences:ans.preferences,occasions:ans.occasions,mustHave:ans.mustHave,avoid:ans.avoid,anythingElse:ans.anythingElse,specialDetails:ans.anythingElse,contactMethod:ans.contactMethod,bestTime:ans.bestTime,referral:ans.referral,referralName:ans.referralName,assignedAgent:agent?.name||"Direct Web Traffic",agentId,dynamic:ans.dynamic,customAnswers:ans.customAnswers,questionnaireVersion:Number(core.version||2)};
 const r=await fetch("/api/new-lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
 const p=await r.json().catch(()=>({}));
 if(!r.ok||!p.success)throw new Error(p.message||"Unable to submit your enquiry");
 cur=9;render();
 } catch(e) {
   const pc=document.getElementById("pageContent");
   pc.innerHTML='<div class="complete"><div class="done-title">We could not submit this yet.</div><div class="gold-bar" style="margin:16px auto 20px"></div><div class="done-sub">'+esc(e.message||"Please try again.")+'</div></div>';
 }
}
